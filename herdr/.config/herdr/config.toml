onboarding = false

[theme]
name = "rose-pine"
auto_switch = false

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "terminal_title_stripped", bold = true, fg = "#ebbcba" }],  # Lovelace title was #8897f4
  [{ token = "workspace", bold = false, dim = true }, { token = "agent", bold = false, dim = true }],
]

[keys]
prefix = "ctrl+a"
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
focus_agent = "prefix+shift+1..9"

[ui]
sidebar_width = 32
prompt_new_workspace_name = true
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sound]
done_path = "sounds/lol_generic_ping.mp3"
request_path = "sounds/lol_assist_me_ping.mp3"

# Rose Pine palette accents
[theme.custom]
accent = "#c4a7e7"
sidebar_bg = "#16141f"
active_row_bg = "#26233a"
selection_bg = "#403d52"
red = "#eb6f92"
green = "#9ccfd8"
yellow = "#f6c177"
mauve = "#c4a7e7"
peach = "#ebbcba"

